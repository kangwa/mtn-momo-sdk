name: CI
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      release_tag:
        description: Exact release tag to validate; empty for ordinary CI.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check
      - run: uv run mypy src
      - run: uv run pytest -m "not sandbox" --cov=mtn_momo --cov-report=term-missing

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.10"
      - run: uv sync --locked --dev
      - run: uv build --no-sources
      - run: uv run twine check dist/*
      - name: Validate artifact contents and release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: uv run python scripts/check_dist.py --version "$(uv version --short)" --tag "$RELEASE_TAG"
      - name: Test the installed wheel outside the checkout
        run: |
          uv venv "$RUNNER_TEMP/wheel-test" --python 3.10
          uv pip install --python "$RUNNER_TEMP/wheel-test/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-test/bin/python" -I -c "import mtn_momo; from importlib.resources import files; assert files('mtn_momo').joinpath('py.typed').is_file(); assert callable(mtn_momo.MomoClient); assert callable(mtn_momo.AsyncMomoClient)"
          "$RUNNER_TEMP/wheel-test/bin/mtn-momo-provision" --help
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
