name: Publish to PyPI

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      release_tag: ${{ github.event.release.tag_name || '' }}

  publish:
    if: github.event_name == 'release' && github.repository == 'kangwa/mtn-momo-sdk'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mtn-momo-python/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish the exact validated artifacts using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
