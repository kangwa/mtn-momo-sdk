name: Sandbox Smoke Test
on:
  workflow_dispatch: {}
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.10"
      - run: uv sync --dev
      - run: uv run pytest -m sandbox -v
        env:
          MOMO_COL_SUBSCRIPTION_KEY: ${{ secrets.MOMO_COL_SUBSCRIPTION_KEY }}
          MOMO_COL_API_USER: ${{ secrets.MOMO_COL_API_USER }}
          MOMO_COL_API_KEY: ${{ secrets.MOMO_COL_API_KEY }}
          MOMO_DIS_SUBSCRIPTION_KEY: ${{ secrets.MOMO_DIS_SUBSCRIPTION_KEY }}
          MOMO_DIS_API_USER: ${{ secrets.MOMO_DIS_API_USER }}
          MOMO_DIS_API_KEY: ${{ secrets.MOMO_DIS_API_KEY }}
          MOMO_REM_SUBSCRIPTION_KEY: ${{ secrets.MOMO_REM_SUBSCRIPTION_KEY }}
          MOMO_REM_API_USER: ${{ secrets.MOMO_REM_API_USER }}
          MOMO_REM_API_KEY: ${{ secrets.MOMO_REM_API_KEY }}
          MOMO_SANDBOX_SUBSCRIPTION_KEY: ${{ secrets.MOMO_SANDBOX_SUBSCRIPTION_KEY }}
