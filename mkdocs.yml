site_name: mtn-momo-sdk
site_description: Unofficial Python SDK for the MTN MoMo Open API
repo_url: https://github.com/kangwa/mtn-momo-sdk

theme:
  name: material

markdown_extensions:
  - md_in_html
  - admonition
  - pymdownx.superfences

nav:
  - Home: index.md
  - API Reference: reference.md

plugins:
  - search
  - callouts
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
