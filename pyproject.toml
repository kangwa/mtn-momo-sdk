[project]
name = "mtn-momo-python"
version = "0.1.0"
description = "Unofficial Python SDK for the MTN Mobile Money (MoMo) Open API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    { name = "Kangwa Bwali", email = "kangwab@proton.me" },
]
keywords = ["mtn", "momo", "mobile money", "payments", "fintech", "africa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
]

[project.urls]
Homepage = "https://github.com/kangwa/mtn-momo-sdk"
Repository = "https://github.com/kangwa/mtn-momo-sdk"
Issues = "https://github.com/kangwa/mtn-momo-sdk/issues"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[project.scripts]
mtn-momo-provision = "mtn_momo.provisioning:main"

[dependency-groups]
dev = [
    "coverage[toml]>=7.15.4",
    "mypy>=2.3.1",
    "pre-commit>=3.7",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0",
    "respx>=0.23.1",
    "ruff>=0.16.3",
    "twine>=7.0.0",
]

docs = [
  "mkdocs>=1.6,<2.0",
  "mkdocs-callouts>=1.13",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[tool.uv.build-backend]
# The distribution name (mtn-momo-python) and import name (mtn_momo) differ.
module-name = "mtn_momo"

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
markers = ["sandbox: hits the real MTN sandbox, requires MOMO_* env vars"]
